[package]
name = "hyprkwin"
version = "0.1.0"
edition = "2021"
description = "D-Bus bridge: makes Hyprland pretend to be KWin for KDE Plasma shell"

[dependencies]
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"

[profile.release]
strip = true
lto = true
